name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]
    env:
      YOLO_MODEL_PATH: /does/not/exist/yolo11n.pt
      MP_MODEL_PATH: /does/not/exist/face_landmarker.task
      TS_MODEL_PATH: ${{ github.workspace }}/models/does_not_exist.keras
      DRIVER_MODELS_DIR: ${{ github.workspace }}/models/does_not_exist_dir
      CORS_ORIGINS: http://localhost:3000
      PYTHONPATH: ""
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies (core test subset)
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest starlette httpx fastapi uvicorn numpy pillow pandas joblib
          python -m pip install \
            scikit-learn==1.8.0 scipy tensorflow
      - name: Syntax check
        run: python -m compileall . -q
      - name: Run tests
        run: python -m pytest -q
